<template>
    <template if:false={scanStarted}>
        <div class="landing">
            <h1 class="title">Sentinel Dashboard</h1>
            <lightning-button
                variant="brand"
                label="Run Scan"
                onclick={handleStartScan}
            ></lightning-button>
        </div>
    </template>

    <template if:true={scanStarted}>
        <lightning-card title="SFDC Sentinel - Org Audit Dashboard" icon-name="standard:metrics">
            <div class="slds-m-around_medium">

                <div class="slds-grid slds-gutters slds-m-bottom_medium">
                    <div class="slds-col">
                        <lightning-button
                            variant="brand"
                            label={scanButtonLabel}
                            onclick={handleStartScan}
                            disabled={isScanning}
                        ></lightning-button>
                    </div>
                    <div class="slds-col">
                        <lightning-button
                            variant="neutral"
                            label={testButtonLabel}
                            onclick={handleRunTests}
                            disabled={isRunningTests}
                        ></lightning-button>
                    </div>
                    <template if:true={testStatusMessage}>
                        <div class="slds-col slds-align-middle">
                            <span class="slds-text-body_small slds-text-color_weak">
                                {testStatusMessage}
                            </span>
                        </div>
                    </template>
                </div>

                <template if:true={isScanning}>
                    <div class="slds-m-top_small slds-m-bottom_medium">
                        <div class="slds-grid slds-grid_align-center slds-m-bottom_small">
                            <lightning-spinner
                                alternative-text="Scanning..."
                                size="medium">
                            </lightning-spinner>
                        </div>
                        <lightning-progress-bar
                            value={progressPercent}
                            size="large">
                        </lightning-progress-bar>
                        <p class="slds-text-body_small slds-m-top_x-small slds-text-align_center">
                            {progressLabel}
                        </p>
                    </div>
                </template>

                <template if:true={showFlow}>
                    <div class="slds-m-top_medium">
                        <lightning-flow
                            flow-api-name="Remediate_Missing_FLS"
                            onstatuschange={handleFlowStatusChange}>
                        </lightning-flow>
                    </div>
                </template>

                <template if:true={hasFindings}>
                    <div class="slds-m-top_medium">
                        <lightning-datatable
                            key-field="Id"
                            data={findings}
                            columns={columns}
                            hide-checkbox-column="true"
                            onrowaction={handleRowAction}
                        ></lightning-datatable>
                    </div>
                </template>

                <template if:true={showNoFindings}>
                    <p class="slds-m-top_medium slds-text-color_weak">
                        No findings detected. Your org looks clean.
                    </p>
                </template>

            </div>
        </lightning-card>
    </template>
</template>
